<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vertical Film Company</title>
    <meta name="description" content="Vertical Film Company" />
    <link rel="icon" href="logo.png" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      img {
        width: min(90vw, calc(74vh * 328 / 374));
        height: auto;
        display: block;
      }
    </style>
  </head>
  <body>
    <img src="logo.png" alt="Vertical Film Company" />
  </body>
</html>
